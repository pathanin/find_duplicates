<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duplicate image review</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header id="control-panel">
  <form id="scan-form">
    <div class="scan-form-row">
      <input id="f-directory" type="text" placeholder="directory to scan" required>
      <button type="submit" id="scan-btn" class="btn-primary">Scan</button>
      <button type="button" id="options-toggle" class="btn-ghost" aria-expanded="false" aria-controls="scan-options" title="Threshold, recursive scan, destination folder, dry-run">Options ▾</button>
      <span id="scan-status"></span>
    </div>
    <div id="scan-options" class="scan-form-row" hidden>
      <label>threshold <input id="f-threshold" type="number" min="0" max="64" value="10" style="width:4em"></label>
      <label><input id="f-recursive" type="checkbox"> recursive</label>
      <input id="f-dest" type="text" placeholder="dest (default: <dir>/_duplicates)">
      <label><input id="f-dry-run" type="checkbox"> dry-run</label>
    </div>
  </form>
  <div id="progress-bar-wrap" hidden>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <span id="progress-label"></span>
  </div>
</header>

<div id="error-banner" class="banner banner-error" hidden></div>
<div id="dry-run-banner" class="banner banner-warn" hidden>
  ⚠ Dry run — no files will actually be moved. Confirm/skip still update review status.
</div>
<div id="review-progress" class="banner banner-info" hidden></div>

<main id="body">
  <nav id="sidebar">
    <ul id="group-list"></ul>
  </nav>
  <section id="detail">
    <div id="images-row"></div>
    <!-- Explicit ARIA roles are load-bearing, not redundant: this table is
         display:grid with display:contents on thead/tbody/tr (see style.css)
         so the grid can own the cells directly, and that strips the native
         table semantics -- without these roles every th/td is exposed as a
         bare "generic" with no row/column association at all, leaving a
         screen reader a flat list of ~50 unlabeled numbers. -->
    <table id="metrics-table" role="table"><thead role="rowgroup"></thead><tbody role="rowgroup"></tbody></table>
    <div id="status-line"></div>
    <div id="actions">
      <!-- Each title says what the button does and then its shortcut, in that
           order and that shape. These used to be a bare "Enter / c", "Delete
           / s", "o" and one prose string -- four different formats, three of
           which never said the characters were shortcuts at all. The button's
           own label already names the action, so the tooltip is where the
           consequence belongs (it becomes the accessible description, with
           the visible label staying the accessible name). -->
      <div class="actions-decide">
        <button id="btn-confirm" class="btn-primary"
          title="Keep the selected file and move the others to the destination folder. Shortcut: Enter or C">Confirm keep</button>
        <button id="btn-skip"
          title="Leave every file in this group where it is and move on. Shortcut: Delete, Backspace or S">Skip group</button>
      </div>
      <div class="actions-utility">
        <button id="btn-open" class="btn-ghost"
          title="Open the file you're keeping at full resolution, in a new tab. Shortcut: O">Open full-res</button>
        <button id="btn-help" class="btn-ghost"
          title="Metrics, scoring and keyboard shortcuts. Shortcut: ? or F1">Help</button>
      </div>
    </div>
  </section>
</main>

<div id="help-modal" class="modal" hidden>
  <div class="modal-box">
    <button id="help-close" class="modal-close">&times;</button>
    <div id="help-body"></div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
